name: Build image

env:
  REGISTRY: ${{ vars.GITEA_REGISTRY }}

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main

jobs:
  build:
    runs-on:
      - ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install NBGV
        id: nbgv
        uses: dotnet/nbgv@v0.5.2

      - name: Determine version
        shell: bash
        run: |
          VERSION="${{ steps.nbgv.outputs.NuGetPackageVersion }}"
          if [ -z "$VERSION" ]; then
            echo "NBGV did not produce NuGetPackageVersion." >&2
            exit 1
          fi

          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "ASSEMBLY_VERSION=${{ steps.nbgv.outputs.AssemblyVersion }}" >> "$GITHUB_ENV"
          echo "FILE_VERSION=${{ steps.nbgv.outputs.AssemblyFileVersion }}" >> "$GITHUB_ENV"

          BUILD_TIMESTAMP=$(date -u +"%Y%m%d.%H%M%S")
          INFO_VERSION="${{ steps.nbgv.outputs.AssemblyInformationalVersion }}+build.${BUILD_TIMESTAMP}"
          echo "INFO_VERSION=${INFO_VERSION}" >> "$GITHUB_ENV"

          IMAGE_REPOSITORY=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_REPOSITORY=${IMAGE_REPOSITORY}" >> "$GITHUB_ENV"

      - name: Validate registry configuration
        shell: bash
        run: |
          if [ -z "$REGISTRY" ]; then
            echo "The GITEA_REGISTRY Actions variable is not configured." >&2
            exit 1
          fi

          if [[ "$REGISTRY" == *"://"* || "$REGISTRY" == */* ]]; then
            echo "GITEA_REGISTRY must be a registry hostname with an optional port, without a scheme or path." >&2
            exit 1
          fi

      - name: Log in to Gitea Container Registry
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.PACKAGE_WRITE_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_REPOSITORY }}
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Keylet/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            VERSION=${{ env.VERSION }}
            ASSEMBLY_VERSION=${{ env.ASSEMBLY_VERSION }}
            FILE_VERSION=${{ env.FILE_VERSION }}
            INFO_VERSION=${{ env.INFO_VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
